<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better Trade 2026 — Scroll Hero</title>
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/hero.css">
</head>

<body class="is-loading">

    <header class="site-header" id="site-header">
        <div class="site-header__inner">
            <a class="site-header__logo" href="#home" aria-label="Better Trade 2026 Home">
                <img src="images/better-trade-logo-black.png" alt="Better Trade">
            </a>

            <nav class="site-header__nav" aria-label="เมนูหลัก">
                <a href="#home" aria-current="page">Home</a>
                <a href="#ticket">Ticket</a>
                <a href="#game">Game</a>
                <a href="#agenda">Agenda</a>
                <a href="#speaker">Speaker</a>
                <a href="#contact">Contact</a>
            </nav>

            <div class="site-header__actions">
                <a class="bt-action-button bt-action-button--secondary bt-action-button--xl bt-action-button--header" href="#playbook">Playbook</a>
                <a class="bt-action-button bt-action-button--primary bt-action-button--xl bt-action-button--header" href="#ticket">ลงทะเบียน</a>
            </div>

            <button class="site-header__toggle" type="button" aria-expanded="false" aria-controls="site-mobile-menu"
                aria-label="เปิดเมนู">
                <span class="site-header__toggle-lines"
                    aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
        </div>

        <div class="site-header__mobile" id="site-mobile-menu">
            <nav class="site-header__mobile-nav" aria-label="เมนูหลักสำหรับมือถือ">
                <a href="#home">Home</a>
                <a href="#ticket">Ticket</a>
                <a href="#game">Game</a>
                <a href="#agenda">Agenda</a>
                <a href="#speaker">Speaker</a>
                <a href="#contact">Contact</a>
            </nav>
            <div class="site-header__mobile-actions">
                <a class="bt-action-button bt-action-button--secondary bt-action-button--xl bt-action-button--header" href="#playbook">Playbook</a>
                <a class="bt-action-button bt-action-button--primary bt-action-button--xl bt-action-button--header" href="#ticket">ลงทะเบียน</a>
            </div>
        </div>
    </header>
    <button class="site-header__backdrop" type="button" aria-label="ปิดเมนู"></button>
    <div class="site-scrollbar" id="site-scrollbar" role="scrollbar" aria-label="ตำแหน่งการเลื่อนหน้าเว็บ"
        aria-controls="scroller" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100"
        aria-valuenow="0" tabindex="-1">
        <span class="site-scrollbar__thumb"></span>
    </div>
    <div id="home" aria-hidden="true"></div>

    <div id="scroller">
        <div id="stagewrap">
            <div id="bg" aria-hidden="true">
                <video id="sky-video" muted loop playsinline preload="metadata"
                    poster="images/sky-poster.webp" disablepictureinpicture>
                    <source src="video/sky-video-loop.mp4" type="video/mp4">
                </video>
            </div>

            <div id="stage">
                <img id="ship" src="images/ship.webp" alt="Playbook ship">
                <div id="walls" aria-hidden="true">
                    <div id="wall-left-intro" class="wall-intro-panel">
                        <img id="wall-left" class="wall-panel" src="images/wall-left-1280.webp"
                            srcset="images/wall-left-1280.webp 1280w, images/wall-left-1920.webp 1920w, images/wall-left-2560.webp 2560w, images/wall-left.webp 3240w"
                            sizes="100vw" alt="">
                    </div>
                    <div id="wall-right-intro" class="wall-intro-panel">
                        <img id="wall-right" class="wall-panel" src="images/wall-right-1280.webp"
                            srcset="images/wall-right-1280.webp 1280w, images/wall-right-1920.webp 1920w, images/wall-right-2560.webp 2560w, images/wall-right.webp 3240w"
                            sizes="100vw" alt="">
                    </div>
                </div>
                <img id="stairs" src="images/stairs.webp" alt="Staircase">
                <img id="pshadow" src="images/people-shadow.webp" alt="">
                <!-- the eight runners are appended here by script, one element each -->


                <div class="asset" id="a-title">
                    <div class="floaty">
                        <div class="inner">
                            <img src="images/title.webp" alt="New World New Playbook — Better Trade 2026">
                        </div>
                    </div>
                </div>

                <div class="asset" id="a-triangle">
                    <div class="floaty">
                        <div class="inner">
                            <img src="images/triangle.webp" alt="">
                        </div>
                    </div>
                </div>
                <div class="asset" id="a-bitcoin">
                    <div class="floaty">
                        <div class="inner">
                            <img src="images/bitcoin.webp" alt="">
                        </div>
                    </div>
                </div>
                <div class="asset" id="a-gold">
                    <div class="floaty">
                        <div class="inner">
                            <img src="images/gold.webp" alt="">
                        </div>
                    </div>
                </div>
                <div class="asset" id="a-heart">
                    <div class="floaty">
                        <div class="inner">
                            <img src="images/heart.webp" alt="">
                        </div>
                    </div>
                </div>
                <div class="asset" id="a-card">
                    <div class="floaty">
                        <div class="inner">
                            <img src="images/card.webp" alt="">
                        </div>
                    </div>
                </div>
                <div class="asset" id="a-stock">
                    <div class="floaty">
                        <div class="inner">
                            <img src="images/stock.webp" alt="">
                        </div>
                    </div>
                </div>
            </div>

            <div id="ui">
                <div id="cta-slot"></div>
                <div class="event-details">
                    <div class="time">09:00 – 18:30 น.</div>
                    <div class="date">31 ต.ค. - 1 พ.ย. 2569</div>
                    <div class="venue">Samyan Mitrtown Hall</div>
                </div>
            </div>

            <div id="loader" role="status" aria-label="กำลังโหลด Better Trade 2026">
                <div class="loader-surface"></div>

                <div class="loader-icons" aria-hidden="true">
                    <img class="loader-icon" data-loader-icon="stock" src="images/stock.webp" alt="">
                    <img class="loader-icon" data-loader-icon="bitcoin" src="images/bitcoin.webp" alt="">
                    <img class="loader-icon" data-loader-icon="gold" src="images/gold.webp" alt="">
                    <img class="loader-icon" data-loader-icon="card" src="images/card.webp" alt="">
                    <img class="loader-icon" data-loader-icon="heart" src="images/heart.webp" alt="">
                    <img class="loader-icon" data-loader-icon="triangle" src="images/triangle.webp" alt="">
                </div>

                <div class="loader-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                    aria-valuenow="0">
                    <div class="loader-progress__meta"><span>LOADING</span><span class="loader-progress__value">00%</span></div>
                    <div class="loader-progress__track"><span class="loader-progress__fill"></span></div>
                </div>
            </div>

            <div id="kvref"></div>
        </div>
    </div>

    <section id="after">NEXT SECTION</section>

    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/action-button.js"></script>
    <script src="js/hero-header.js"></script>

    <!-- Liquid metal CTAs (WebGL). Module scripts are deferred, so this runs after
     the markup exists but before window 'load' fires the hero intro. -->
    <script type="module" src="js/hero-cta.js"></script>

    <script src="vendor/gsap/gsap.min.js"></script>
    <script src="vendor/gsap/ScrollTrigger.min.js"></script>
    <script src="js/hero-scroll-motion.js"></script>
</body>

</html>
